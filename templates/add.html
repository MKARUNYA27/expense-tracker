<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Transaction</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            background: white;
            padding: 40px;
            border-radius: 20px;
            max-width: 500px;
            width: 100%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            text-align: center;
            color: #2d3436;
            margin-bottom: 30px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #2d3436;
        }
        input, select {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            border: 2px solid #dfe6e9;
            border-radius: 10px;
            font-size: 1rem;
        }
        input:focus, select:focus {
            border-color: #667eea;
            outline: none;
        }
        .btn {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: bold;
            cursor: pointer;
        }
        .btn:hover {
            background: #5a67d8;
        }
        .btn-secondary {
            background: #b2bec3;
            margin-top: 10px;
            text-align: center;
            display: block;
            text-decoration: none;
            color: white;
            padding: 12px;
            border-radius: 10px;
        }
        .btn-secondary:hover {
            background: #636e72;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>➕ Add Transaction</h1>
       <form method="POST">
    <label>Type</label>
    <select name="type" required>
        <option value="income">💰 Income</option>
        <option value="expense">💸 Expense</option>
    </select>

    <label>Amount (₹)</label>
    <input type="number" name="amount" step="0.01" required placeholder="e.g., 500" min="0">

    <label>Category</label>
    <select name="category" required>
        <option value="Food">🍔 Food</option>
        <option value="Rent">🏠 Rent</option>
        <option value="Transport">🚗 Transport</option>
        <option value="Shopping">🛍️ Shopping</option>
        <option value="Entertainment">🎮 Entertainment</option>
        <option value="Salary">💼 Salary</option>
        <option value="Other">📦 Other</option>
    </select>

            <label>Description</label>
            <input type="text" name="description" placeholder="e.g., Lunch with friends" required>

            <label>Date</label>
            <input type="date" name="date" required>

            <button type="submit" class="btn">💾 Save Transaction</button>
        </form>
        <a href="/" class="btn-secondary">← Back to Dashboard</a>
    </div>
</body>
</html>
